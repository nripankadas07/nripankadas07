name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate repository docs
        run: |
          test -s README.md
          test -s LICENSE
      - name: Check local markdown links
        run: python scripts/check_links.py
